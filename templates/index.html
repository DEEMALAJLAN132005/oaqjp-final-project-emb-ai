<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IBM Skills Network — Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
    <script defer src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
<main class="container mt-5">
    <section class="card shadow-sm">
        <div class="card-body">
            <h1 class="text-center mb-4">NLP - Emotion Detection</h1>
            <label for="textToAnalyze">Please enter the text to be analyzed</label>
            <textarea id="textToAnalyze" class="form-control" rows="4"></textarea>
            <button id="analyzeButton" class="btn btn-primary mt-3"
                    onclick="RunSentimentAnalysis()" type="button">
                Run Sentiment Analysis
            </button>
            <hr>
            <h2 class="h5">Result of Emotion Detection</h2>
            <div id="system_response" aria-live="polite" class="p-3 border rounded"></div>
        </div>
    </section>
</main>
</body>
</html>
